<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ফটো ফ্রেম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">

body{font-family:'Hind Siliguri';background:#eef6ff;display:flex;justify-content:center;padding:12px;margin:0}

#frame{position:relative;width:100%;aspect-ratio:1;background:#ddd;overflow:hidden}
#photo{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;background:#ddd;overflow:hidden}
#userPhoto{position:absolute;left:50%;top:50%;width:130%;height:130%;object-fit:cover;transform:translate(-50%,-50%);touch-action:none}
#overlay{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;pointer-events:none}
</style>
</head>
<body>
<div class="app">
<input type="file" id="file" accept="image/*" style="width:100%;margin-bottom:10px">
<div style="display:flex;gap:10px;margin-bottom:10px">

<input id="desigIn" value="প্রচার সম্পাদক" style="flex:1;padding:8px">
</div>
<div style="display:flex;gap:10px;align-items:center;background:#e3f2fd;padding:10px;border-radius:12px;margin-bottom:12px">
<span>🔍 জুম</span><input type="range" id="zoom" min="80" max="350" value="130" style="flex:1"><span id="zlab">130%</span>
</div>
<div id="capture" style="background:#fff;border-radius:16px;overflow:hidden;border:1px solid #ddd">
<div id="frame"><div id="photo"><img id="userPhoto" style="display:none"></div><img id="overlay" src="frame.png"></div>
<div style="text-align:center;padding:14px"><div id="nameTxt" style="font-weight:800;color:#0b2f8f;font-size:22px">মোঃ যোবায়ের আহমেদ গাজীপুরী</div><div id="desigTxt" style="font-weight:600">প্রচার সম্পাদক</div></div>
</div>
<button id="btn" style="width:100%;background:#0b5db0;color:#fff;border:none;padding:15px;border-radius:14px;font-family:'Hind Siliguri';font-weight:700;font-size:18px;margin-top:14px">⬇️ ডাউনলোড করুন</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const file=document.getElementById('file'),img=document.getElementById('userPhoto'),zoom=document.getElementById('zoom'),zlab=document.getElementById('zlab');
let sc=1.3,px=0,py=0,sx,sy,drag=false,loaded=false;
file.addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{img.src=ev.target.result;img.style.display='block';loaded=true;sc=1.3;px=0;py=0;zoom.value=130;update();};
  r.readAsDataURL(f);
});

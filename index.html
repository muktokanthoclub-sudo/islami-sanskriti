<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইসলামী সাংস্কৃতিক অনুষ্ঠান - প্রোফাইল ফ্রেম</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@600&display=swap');
body{font-family:'Noto Sans Bengali',sans-serif;background:#f0fdf4;margin:0;padding:15px;text-align:center}
.card{max-width:420px;margin:auto;background:white;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:16px}
h2{color:#065f46;margin:10px 0}
canvas{width:100%;border-radius:12px;border:3px solid #065f46;background:#ddd}
input{width:100%;margin:8px 0;padding:10px;border-radius:8px;border:1px solid #ccc;font-family:inherit}
button{width:100%;padding:12px;background:#065f46;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;margin-top:8px}
button:disabled{background:#999}
</style>
</head>
<body>
<div class="card">
<h2>ইসলামী সাংস্কৃতিক অনুষ্ঠান</h2>
<p>আপনার ছবি দিয়ে ফ্রেম তৈরি করুন</p>
<input type="file" id="upload" accept="image/*">
<input type="text" id="nameInput" placeholder="আপনার নাম লিখুন (যেমন: মুহাম্মাদ আব্দুল্লাহ)">
<canvas id="canvas" width="1080" height="1080"></canvas>
<button id="download">ডাউনলোড করুন</button>
<p style="font-size:12px;color:#666">মুক্তকণ্ঠ ক্লাব</p>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const upload=document.getElementById('upload');
const nameInput=document.getElementById('nameInput');
let img=null;
let imgX=0,imgY=0,imgScale=1;

function draw(){
 ctx.clearRect(0,0,1080,1080);
 // background
 ctx.fillStyle='#ffffff';
 ctx.fillRect(0,0,1080,1080);
 // user image
 if(img){
   const w=img.width*imgScale;
   const h=img.height*imgScale;
   ctx.drawImage(img,imgX,imgY,w,h);
 }
 // Islamic frame - top border
 ctx.fillStyle='#065f46';
 ctx.fillRect(0,0,1080,25);
 ctx.fillRect(0,0,25,1080);
 ctx.fillRect(1055,0,25,1080);
 // gold line
 ctx.fillStyle='#d4af37';
 ctx.fillRect(0,25,1080,6);
 ctx.fillRect(0,1050,1080,6);
 // bottom banner
 ctx.fillStyle='#065f46';
 ctx.fillRect(0,850,1080,230);
 // gold pattern line
 ctx.fillStyle='#d4af37';
 ctx.fillRect(0,850,1080,5);
 // text
 ctx.fillStyle='#ffffff';
 ctx.textAlign='center';
 ctx.font='bold 52px Noto Sans Bengali';
 ctx.fillText('ইসলামী সাংস্কৃতিক অনুষ্ঠান',540,925);
 ctx.font='600 32px Noto Sans Bengali';
 ctx.fillStyle='#fef08a';
 ctx.fillText('মুক্তকণ্ঠ শিল্পীগোষ্ঠী',540,975);
 // name
 if(nameInput.value){
   ctx.fillStyle='#ffffff';
   ctx.font='bold 36px Noto Sans Bengali';
   ctx.fillText(nameInput.value,540,1025);
 }
 // corner decoration
 ctx.fillStyle='#d4af37';
 ctx.font='40px serif';
 ctx.fillText('☪',60,80);
 ctx.fillText('☪',1020,80);
}
upload.addEventListener('change',e=>{
 const file=e.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=ev=>{
   img=new Image();
   img.onload=()=>{
     // fit image
     const scale=Math.max(1080/img.width,1080/img.height);
     imgScale=scale*1.1;
     imgX=(1080-img.width*imgScale)/2;
     imgY=(1080-img.height*imgScale)/2 -100;
     draw();
   };
   img.src=ev.target.result;
 };
 reader.readAsDataURL(file);
});
nameInput.addEventListener('input',draw);
draw();
document.getElementById('download').addEventListener('click',()=>{
 const a=document.createElement('a');
 a.download='islami-sanskriti-frame.png';
 a.href=canvas.toDataURL('image/png');
 a.click();
});
</script>
</body>
  </html>

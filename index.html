<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইসলামী সাংস্কৃতিক অনুষ্ঠান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Hind Siliguri',sans-serif;background:#eef6ff;margin:0;padding:12px;display:flex;justify-content:center}
.app{max-width:520px;width:100%;background:#fff;border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
h2{text-align:center;color:#0a3d8f;margin:0 0 12px;font-size:18px}
input[type=file]{width:100%;padding:10px;border:1.5px solid #90caf9;border-radius:10px;margin-bottom:10px;box-sizing:border-box}
.row{display:flex;gap:8px;margin-bottom:10px}.row input{flex:1;padding:9px;border:1px solid #ccc;border-radius:8px;font-family:'Hind Siliguri'}
#capture{background:#fff;border-radius:16px;overflow:hidden;padding-bottom:10px}
#mainCircle{position:relative;width:100%;aspect-ratio:1;margin:auto}
#photoWrap{position:absolute;left:6%;top:6%;width:88%;height:88%;border-radius:50%;overflow:hidden;background:#ddd;z-index:1}
#userPhoto{position:absolute;left:50%;top:50%;width:140%;height:140%;object-fit:cover;transform:translate(-50%,-50%);touch-action:none}
#borderOverlay{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;pointer-events:none;background:conic-gradient(from 0deg,#FFD700,#0a4ab5,#FFD700,#0a4ab5,#FFD700);border-radius:50%;mask:radial-gradient(circle,transparent 62%,black 62.5%,black 78%,transparent 78.5%);-webkit-mask:radial-gradient(circle,transparent 62%,black 62.5%,black 78%,transparent 78.5%)}
#goldRing{position:absolute;left:2%;top:2%;width:96%;height:96%;border:8px solid #FFD700;border-radius:50%;box-sizing:border-box;z-index:6;pointer-events:none;box-shadow:inset 0 0 0 4px #0a4ab5, 0 0 15px rgba(255,215,0,.6)}
#lanterns{position:absolute;top:35%;width:100%;display:flex;justify-content:space-between;padding:0 18%;box-sizing:border-box;z-index:7;pointer-events:none;font-size:42px}
#badge{position:absolute;bottom:12%;right:8%;width:34%;aspect-ratio:1;background:radial-gradient(circle,#ff3c00,#8b0000);border:4px solid #FFD700;border-radius:50%;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#badge small{font-size:9px}#badge b{font-size:11px;line-height:1.1}
#dateBox{position:absolute;bottom:0%;left:50%;transform:translateX(-50%);background:#0b4d2e;border:2px solid #FFD700;border-radius:12px;padding:4px 14px;z-index:9;text-align:center;color:#fff;min-width:52%;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#dateBox div:first-child{font-size:15px;font-weight:700}#dateBox div:last-child{background:#FFEB3B;color:#000;border-radius:8px;padding:1px 8px;margin-top:2px;font-weight:700;font-size:13px}
#club{text-align:center;margin-top:12px;line-height:1.2}#club .c1{font-weight:800;color:#0a1f6b;font-size:22px}#club .c2{font-size:14px;color:#000;margin-top:2px}
.ctrl{display:flex;align-items:center;gap:10px;background:#e3f2fd;padding:10px;border-radius:10px;margin:12px 0}
#btn{width:100%;background:#0b5db0;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:18px;font-family:'Hind Siliguri'}
</style>
</head>
<body>
<div class="app">
<h2>ইসলামী সাংস্কৃতিক অনুষ্ঠান - ফটো ফ্রেম</h2>
<input type="file" id="file" accept="image/*">
<div class="row"><input id="nameIn" placeholder="নাম" value="মোঃ যোবায়ের আহমেদ গাজীপুরী"><input id="desigIn" placeholder="পদবী" value="প্রচার সম্পাদক"></div>
<div class="ctrl"><span>🔍</span><input type="range" id="zoom" min="80" max="300" value="140" style="flex:1"><span id="zlab">140%</span></div>

<div id="capture">
<div id="mainCircle">
<div id="photoWrap"><img id="userPhoto" style="display:none"></div>
<div id="borderOverlay"></div>
<div id="goldRing"></div>
<div id="lanterns"><span>🏮</span><span>🏮</span></div>
<div id="badge"><small>🎤</small><b>ইসলামী<br>সংগীত<br>অনুষ্ঠান</b></div>
<div id="dateBox"><div>📅 ২৪ ডিসেম্বর ২০২৬ ইং</div><div>বৃহস্পতিবার</div></div>
</div>
<div id="club">
<div class="c1" id="clubName">আড়ালিয়া মুক্তকণ্ঠ যুব ক্লাব</div>
<div class="c2">(আড়ালিয়া, কাপাসিয়া, গাজীপুর)</div>
<div style="margin-top:6px;font-weight:700;color:#0a1f6b;font-size:16px" id="nameTxt">মোঃ যোবায়ের আহমেদ গাজীপুরী</div>
<div style="font-size:13px;color:#333" id="desigTxt">প্রচার সম্পাদক</div>
</div>
</div>

<button id="btn">⬇️ ডাউনলোড করুন (HD)</button>
<p style="font-size:11px;text-align:center;color:#666">ছবিতে আঙুল দিয়ে টেনে সরাতে পারবেন</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const fileEl=document.getElementById('file'),imgEl=document.getElementById('userPhoto'),zoomEl=document.getElementById('zoom'),zlab=document.getElementById('zlab');
let sc=1.4,px=0,py=0,sx,sy,drag=false,ok=false;
fileEl.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{imgEl.src=ev.target.result;imgEl.style.display='block';ok=true;px=0;py=0;sc=1.4;zoomEl.value=140;upd();};r.readAsDataURL(f);});
function upd(){imgEl.style.transform=`translate(calc(-50% + ${px}px), calc(-50% + ${py}px)) scale(${sc})`;zlab.textContent=Math.round(sc*100)+'%';}
zoomEl.addEventListener('input',()=>{sc=zoomEl.value/100;upd();});
imgEl.addEventListener('pointerdown',e=>{if(!ok)return;drag=true;sx=e.clientX-px;sy=e.clientY-py;imgEl.setPointerCapture(e.pointerId);});
window.addEventListener('pointermove',e=>{if(!drag)return;px=e.clientX-sx;py=e.clientY-sy;upd();});
window.addEventListener('pointerup',()=>drag=false);
document.getElementById('nameIn').addEventListener('input',e=>document.getElementById('nameTxt').textContent=e.target.value);
document.getElementById('desigIn').addEventListener('input',e=>document.getElementById('desigTxt').textContent=e.target.value);
document.getElementById('btn').addEventListener('click',()=>{if(!ok){alert('আগে ছবি দিন');return;}document.getElementById('btn').textContent='তৈরি হচ্ছে...';html2canvas(document.getElementById('capture'),{scale:3,useCORS:true,backgroundColor:'#ffffff'}).then(c=>{const a=document.createElement('a');a.download='islami-frame.png';a.href=c.toDataURL('image/png');a.click();document.getElementById('btn').textContent='⬇️ ডাউনলোড করুন (HD)';});});
</script>
</body>
                            </html>

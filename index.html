<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইসলামী সাংস্কৃতিক অনুষ্ঠান - প্রোফাইল ফ্রেম</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@600;700&display=swap');
body{font-family:'Noto Sans Bengali',sans-serif;background:#f0fdf4;margin:0;padding:15px;text-align:center}
.card{max-width:420px;margin:auto;background:white;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:16px}
h2{color:#065f46;margin:8px 0;font-size:18px;line-height:1.4}
canvas{width:100%;border-radius:12px;border:3px solid #065f46;background:#ddd}
input{width:100%;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #ccc;font-family:inherit;box-sizing:border-box}
button{width:100%;padding:12px;background:#065f46;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2>আড়ালিয়া মুক্তকণ্ঠ যুব ক্লাবের<br>ইসলামী সাংস্কৃতিক অনুষ্ঠান</h2>
<input type="file" id="upload" accept="image/*">
<input type="text" id="nameInput" placeholder="আপনার নাম লিখুন">
<canvas id="canvas" width="1080" height="1080"></canvas>
<button id="download">ডাউনলোড করুন</button>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const upload=document.getElementById('upload');
const nameInput=document.getElementById('nameInput');
let img=null; let imgX=0,imgY=0,imgScale=1;

function draw(){
 ctx.clearRect(0,0,1080,1080);
 ctx.fillStyle='#ffffff';
 ctx.fillRect(0,0,1080,1080);
 if(img){
   const w=img.width*imgScale;
   const h=img.height*imgScale;
   ctx.drawImage(img,imgX,imgY,w,h);
 }
 // Borders
 ctx.fillStyle='#065f46';
 ctx.fillRect(0,0,1080,20);
 ctx.fillRect(0,0,20,1080);
 ctx.fillRect(1060,0,20,1080);
 ctx.fillStyle='#d4af37';
 ctx.fillRect(0,20,1080,6);
 ctx.fillRect(0,1054,1080,6);

 // Bottom Banner - Bigger for all text
 ctx.fillStyle='#065f46';
 ctx.fillRect(0,760,1080,320);
 ctx.fillStyle='#d4af37';
 ctx.fillRect(0,760,1080,5);

 ctx.fillStyle='#ffffff';
 ctx.textAlign='center';

 // Line 1
 ctx.font='bold 32px Noto Sans Bengali';
 ctx.fillText('আড়ালিয়া মুক্তকণ্ঠ যুব ক্লাবের উদ্যোগে',540,815);
 // Line 2
 ctx.font='bold 46px Noto Sans Bengali';
 ctx.fillText('ইসলামী সাংস্কৃতিক অনুষ্ঠান',540,870);
 // Line 3
 ctx.font='600 32px Noto Sans Bengali';
 ctx.fillStyle='#fef08a';
 ctx.fillText('২৪ শে ডিসেম্বর ২০২৬ ইং | রোজ: বৃহস্পতিবার',540,920);
 // Line 4
 ctx.font='600 28px Noto Sans Bengali';
 ctx.fillStyle='#ffffff';
 ctx.fillText('স্থান: আড়ালিয়া ফাজিল মাদরাসা সংলগ্ন',540,965);
 
 // User Name
 if(nameInput.value){
   ctx.fillStyle='#bbf7d0';
   ctx.fillRect(280,985,520,55);
   ctx.fillStyle='#065f46';
   ctx.font='bold 32px Noto Sans Bengali';
   ctx.fillText(nameInput.value,540,1022);
 }

 ctx.fillStyle='#d4af37';
 ctx.font='30px serif';
 ctx.fillText('☪',55,75);
 ctx.fillText('☪',1025,75);
}
upload.addEventListener('change',e=>{
 const file=e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=ev=>{
   img=new Image();
   img.onload=()=>{
     const scale=Math.max(1080/img.width, 1080/img.height);
     imgScale=scale*1.15;
     imgX=(1080-img.width*imgScale)/2;
     imgY=(1080-img.height*imgScale)/2 -80;
     draw();
   }; img.src=ev.target.result;
 }; reader.readAsDataURL(file);
});
nameInput.addEventListener('input',draw);
draw();
document.getElementById('download').addEventListener('click',()=>{
 const a=document.createElement('a');
 a.download='islami-frame.png';
 a.href=canvas.toDataURL('image/png');
 a.click();
});
</script>
</body>
</html>

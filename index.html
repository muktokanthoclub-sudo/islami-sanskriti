<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ইসলামী সাংস্কৃতিক অনুষ্ঠান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri';background:#e8f5e9;display:flex;justify-content:center;padding:10px}.app{max-width:480px;width:100%;background:#fff;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.inp{margin-bottom:8px}.inp label{font-size:11px;font-weight:700;color:#0b5d2e}.inp input{width:100%;padding:8px;border:1.5px solid #a5d6a7;border-radius:8px;font-family:'Hind Siliguri'}
.row{display:flex;gap:8px}.row .inp{flex:1}.ctrl{display:flex;gap:8px;background:#e8f5e9;padding:6px 10px;border-radius:8px;margin:8px 0}
#capture{background:#fff;border-radius:12px;padding-bottom:8px}#frame{position:relative;width:100%;aspect-ratio:1.15}
#photo{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:62%;height:62%;border-radius:50%;overflow:hidden;background:#000}
#userPhoto{position:absolute;left:50%;top:50%;width:130%;transform:translate(-50%,-50%);cursor:move;touch-action:none}
#overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
#below{text-align:center;margin-top:4px;padding:8px;background:#f9fff9;border-radius:10px}
#btn{width:100%;background:#0b7a3a;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:700;font-size:18px;margin-top:10px}
</style></head><body><div class="app">
<div class="inp"><label>📷 ছবি আপলোড</label><input type="file" id="file" accept="image/*"></div>
<div class="row"><div class="inp"><label>নাম</label><input id="nameIn" value="মোঃ যোবায়ের আহমেদ গাজীপুরী"></div><div class="inp"><label>পদবী</label><input id="desigIn" value="সাধারণ সম্পাদক"></div></div>
<div class="ctrl"><span>🔍 জুম</span><input type="range" id="zoom" min="80" max="300" value="110"><span id="zlab">110%</span></div>
<div id="capture"><div id="frame"><div id="photo"><img id="userPhoto" style="display:none"></div><img id="overlay" src="frame.png"></div>
<div id="below"><div id="nameTxt" style="font-weight:800;color:#0b5d2e;font-size:18px">মোঃ যোবায়ের আহমেদ গাজীপুরী</div><div id="desigTxt" style="font-weight:600">সাধারণ সম্পাদক</div></div></div>
<button id="btn">⬇️ ডাউনলোড করুন</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const file=document.getElementById('file'),img=document.getElementById('userPhoto'),zoom=document.getElementById('zoom'),zlab=document.getElementById('zlab');
let sc=1.1,px=0,py=0,sx,sy,drag=false,loaded=false;
file.addEventListener('change',e=>{const f=e.target.files[0];const r=new FileReader();r.onload=ev=>{img.src=ev.target.result;img.style.display='block';loaded=true;update();};r.readAsDataURL(f);});
function update(){img.style.transform=`translate(calc(-50% + ${px}px), calc(-50% + ${py}px)) scale(${sc})`;zlab.textContent=Math.round(sc*100)+'%';}
zoom.addEventListener('input',()=>{sc=zoom.value/100;update();});
img.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX-px;sy=e.clientY-py;img.setPointerCapture(e.pointerId);});
img.addEventListener('pointermove',e=>{if(!drag)return;px=e.clientX-sx;py=e.clientY-sy;update();});
img.addEventListener('pointerup',()=>drag=false);
document.getElementById('nameIn').addEventListener('input',e=>document.getElementById('nameTxt').textContent=e.target.value);
document.getElementById('desigIn').addEventListener('input',e=>document.getElementById('desigTxt').textContent=e.target.value);
document.getElementById('btn').addEventListener('click',()=>{if(!loaded){alert('ছবি আপলোড করুন');return;}html2canvas(document.getElementById('capture'),{scale:3,useCORS:true,backgroundColor:'#fff'}).then(c=>{const a=document.createElement('a');a.download='islami-frame-24.png';a.href=c.toDataURL();a.click();});});
</script></body></html>
